[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laurevine-rose"
version = "1.0.0"
description = "Desktop-oriented presentation editor with PowerPoint-grade fidelity and Scientific Figure Studio."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
authors = [
    {name = "Biowess"}
]
keywords = ["presentation", "powerpoint", "pptx", "matplotlib", "latex", "pgfplots", "scientific-figures"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0,<1.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0,<4.0.0",
    "scipy>=1.11.0,<2.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "httpx>=0.27.0,<1.0.0",
    "playwright>=1.40.0,<2.0.0",
]

[project.scripts]
rpe = "run:main"
rpe-selfcheck = "backend.figures.selfcheck:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
