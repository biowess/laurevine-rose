<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Laurevine Rose</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img src="Assets/splash.png" alt="Laurevine Rose">
</body>
</html>
